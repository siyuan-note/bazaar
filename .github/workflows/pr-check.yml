name: PR Check

# REF https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_target
#
# 触发：
# - pull_request_target：PR 打开 / 同步 / 重开 / 打 Check 标签时检查
# - schedule / workflow_dispatch：复检开放中非 ci-passed 的 PR（作者常只改包仓库 Release；亦覆盖尚无 CI 标签者）
#   schedule 按评论 meta 指纹变更 / 退避到期筛选；workflow_dispatch 强制全选（仍受 SELECT_LIMIT）
#   select 顺带关闭开立超过 30 天且仍为下列之一的 PR（先评论再关；ci-skip 除外）：
#   - ci-failed
#   - 同时带 ci-passed 与 manual-review（维护者已要求修改，作者未跟进）
#
# 标签：
# - Check：维护者打标以立即重跑本检查（打标后会自动去掉）
# - ci-skip：维护者打标则跳过检查（与 Check 同时存在时以 ci-skip 为准）；亦跳过超龄自动关闭
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - main
    paths:
      - plugins.txt
      - themes.txt
      - icons.txt
      - templates.txt
      - widgets.txt
      - deprecated.json
      # 黑名单路径：用于触发检查（命中后由 Go 以 FlowError 失败，不跑包检查）
      - config/themes-theme-js-allowlist.txt
      - stage/**
  schedule:
    # 每 20 分钟：select 按指纹 / 退避筛选后再全检
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

# pull_request_target：同一 PR 重复触发时取消整次旧 run（含 prepare），减轻双开竞态
# schedule / workflow_dispatch：用 run_id 互不取消；同 PR 仍靠下方 check job 的 concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # 产出待检 PR 矩阵：事件 PR 一条，或定时/手动筛选开放非 ci-passed
  prepare:
    if: |
      github.repository == 'siyuan-note/bazaar' && github.ref == 'refs/heads/main' &&
      (
        (
          github.event_name == 'pull_request_target' &&
          !contains(toJSON(github.event.pull_request.labels.*.name), '"ci-skip"') &&
          (github.event.action != 'labeled' || github.event.label.name == 'Check')
        ) ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
    outputs:
      matrix: ${{ steps.build.outputs.matrix || steps.build-select.outputs.matrix }}
      any: ${{ steps.build.outputs.any || steps.build-select.outputs.any }}
    steps:
      - name: Build PR matrix (event)
        id: build
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          include=$(jq -nc \
            --argjson number "$PR_NUMBER" \
            --arg head_sha "$PR_HEAD_SHA" \
            --arg base_sha "$PR_BASE_SHA" \
            --arg head_repo "$PR_HEAD_REPO" \
            '[{number: $number, head_sha: $head_sha, base_sha: $base_sha, head_repo: $head_repo}]')
          matrix=$(jq -nc --argjson include "$include" '{include: $include}')
          any=$(jq -nc --argjson include "$include" '$include | length > 0')
          echo "PRs to check (any=$any): $include"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"

      - name: Check out bazaar (select)
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Golang (select)
        if: github.event_name != 'pull_request_target'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build PR matrix (schedule / dispatch)
        id: build-select
        if: github.event_name != 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # workflow_dispatch：强制纳入全部开放非 ci-passed（仍受 SELECT_LIMIT）
          SELECT_FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: go run ./actions/check -select

  check:
    needs: prepare
    if: needs.prepare.outputs.any == 'true'
    name: "Check #${{ matrix.number }} ${{ matrix.head_repo }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    concurrency:
      group: pr-check-${{ matrix.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Check out trusted Bazaar revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Analyze PR data without write credentials
        env:
          BAZAAR_HEAD_PATH: .
          PR_NUMBER: ${{ matrix.number }}
          PR_HEAD_SHA: ${{ matrix.head_sha }}
          PR_TARGET_SHA: ${{ matrix.base_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_RESULT_OUTPUT: ${{ runner.temp }}/bazaar-check.json
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$PR_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head:refs/bazaar/check-head"
          if [[ "$(git rev-parse refs/bazaar/check-head)" != "$PR_HEAD_SHA" ]]; then
            echo "PR changed since selection; skipping this revision"
            exit 0
          fi
          PR_BASE_SHA="$(git merge-base "$PR_TARGET_SHA" "$PR_HEAD_SHA")"
          export PR_BASE_SHA
          export GOWORK=off
          stop_token="$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::$stop_token"
          env -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH -u GITHUB_STATE go run ./actions/check -analyze
          echo "::$stop_token::"
      - name: Upload structured check result
        uses: actions/upload-artifact@v7
        with:
          name: bazaar-check-${{ github.run_attempt }}-${{ matrix.number }}-${{ matrix.head_sha }}
          path: ${{ runner.temp }}/bazaar-check.json
          if-no-files-found: ignore
          retention-days: 2

  publish:
    needs: [prepare, check]
    if: "!cancelled() && needs.prepare.outputs.any == 'true'"
    name: "Publish #${{ matrix.number }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    concurrency:
      group: pr-check-publish-${{ matrix.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    steps:
      - name: Check out trusted Bazaar revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Find report from this run
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: bazaar-check-${{ github.run_attempt }}-${{ matrix.number }}-${{ matrix.head_sha }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --method GET -f name="$ARTIFACT_NAME" \
            --jq '.artifacts[] | select(.expired == false) | .id')
          if [[ -n "$id" ]]; then
            [[ "$id" =~ ^[0-9]+$ ]]
            echo "id=$id" >> "$GITHUB_OUTPUT"
          else
            echo "No report for this PR revision"
          fi
      - name: Setup Golang
        if: steps.report.outputs.id != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download this run's JSON result
        if: steps.report.outputs.id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.report.outputs.id }}
          path: ${{ runner.temp }}/bazaar-result
      - name: Publish check results
        if: steps.report.outputs.id != ''
        env:
          BAZAAR_HEAD_PATH: .
          PR_NUMBER: ${{ matrix.number }}
          PR_HEAD_SHA: ${{ matrix.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          BAZAAR_REVIEWERS: ${{ vars.BAZAAR_REVIEWERS }}
          CHECK_REPORT_INPUT: ${{ runner.temp }}/bazaar-result/bazaar-check.json
          REMOVE_CHECK_LABEL: ${{ github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'Check' }}
        run: |
          set -euo pipefail
          stop_token="$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::$stop_token"
          GOWORK=off go run ./actions/check -publish
          echo "::$stop_token::"
